<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ぽけもじ</title>
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;display:flex;justify-content:center;min-height:100vh}.app{width:min(520px,100%);padding:18px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-weight:800;font-size:22px}.sub{font-size:12px;color:var(--muted)}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:#222;color:#fff;font-weight:700}.ghost{background:#e8e8eb;color:#222}.setup{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:14px 0}.setup-row{display:flex;gap:8px}.setup input{flex:1;border:1px solid #bbb;border-radius:10px;padding:10px 12px;min-width:0}.status{text-align:center;margin:12px 0;font-size:14px}.board{display:grid;grid-template-rows:repeat(10,1fr);gap:6px;width:min(350px,90vw);margin:12px auto 18px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{aspect-ratio:1;border:2px solid var(--border);background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,30px);font-weight:800;text-transform:uppercase;border-radius:5px}.tile.filled{border-color:#888}.tile.correct{background:var(--green);border-color:var(--green);color:#fff}.tile.present{background:var(--yellow);border-color:var(--yellow);color:#fff}.tile.absent{background:var(--gray);border-color:var(--gray);color:#fff}.keyboard{display:grid;gap:6px;max-width:500px;margin:auto}.keyrow{display:flex;gap:5px;justify-content:center}.key{min-width:29px;height:45px;padding:4px 7px;background:#d3d6da;color:#111;border-radius:5px;font-weight:800}.key.wide{min-width:55px;height:48px}.key-small{min-width:44px}.keyrow-small{margin-top:2px}.actions{margin-top:8px;gap:10px}.actions .key{min-width:110px}.actions .enter{background:#e8e8eb}.keyboard{display:grid;gap:5px;max-width:520px;margin:auto}.key{font-size:18px}@media(max-width:390px){.key{min-wi <body><main class="app">
<div class="top"><div><div class="title">ぽけもじ</div><div class="sub">5文字・1問10回・合い言葉で同じ問題</div></div><button class="ghost" id="newBtn">新しい問題</button></div>
<section class="setup"><div style="font-weight:700;margin-bottom:8px">合い言葉</div><div class="setup-row"><input id="seed" maxlength="40" placeholder="例：ヤドラン、10月3日"><button id="startBtn">開始</button><button class="ghost" id="randomBtn">ランダム</button></div><div class="sub" style="margin-top:8px">同じ合い言葉＋同じ問題番号なら、2人とも同じお題になる。</div></section>
<div class="status" id="status">合い言葉を入れて開始</div><div class="board" id="board"></div><div class="msg" id="msg"></div><div class="keyboard" id="keyboard"></div>
<div class="help">Enterで回答。Backspaceで1文字削除。日本語キーボードにも対応。1問につき10回まで回答。正解または10回終了後、答えを表示して次の問題へ自動で進む。</div>
</main><div class="modal" id="modal"><div class="card"><h2 id="modalTitle"></h2><div>答え</div><div class="answer" id="answer"></div><button id="nextBtn">次の問題へ</button></div></div>
<script>
// 2022年公開の5文字リストを土台にし、後発の5文字名を追加する。取得できない場合は内蔵の主要リストで動作する。
const fallback=`ニドラン♀,ニドラン♂,フシギダネ,フシギソウ,フシギバナ,リザードン,カメックス,キャタピー,トランセル,バタフリー,ピジョット,オニスズメ,オニドリル,アーボック,ピカチュウ,ライチュウ,サンドパン,ニドリーナ,ニドクイン,ニドリーノ,ニドキング,キュウコン,ゴルバット,ナゾノクサ,クサイハナ,ラフレシア,パラセクト,モルフォン,ダグトリオ,ペルシアン,ゴルダック,オコリザル,ウインディ,ニョロボン,ユンゲラー,フーディン,ワンリキー,ゴーリキー,カイリキー,マダツボミ,ウツボット,メノクラゲ,ドククラゲ,イシツブテ,ゴローニャ,ギャロップ,レアコイル,ドードリオ,ベトベター,ベトベトン,シェルダー,パルシェン,スリーパー,キングラー,ビリリダマ,マルマイン,サワムラー,エビワラー,ベロリンガ,マタドガス,サイホーン,モンジャラ,トサキント,アズマオウ,ヒトデマン,スターミー,バリヤード,ストライク,ルージュラ,ケンタロス,コイキング,ギャラドス,シャワーズ,サンダース,ブースター,オムナイト,オムスター,カブトプス,フリーザー,ファイヤー,ミニリュウ,ハクリュー,カイリュー,ミュウツー,チコリータ,ベイリーフ,メガニウム,ヒノアラシ,マグマラシ,バクフーン,アリゲイツ,オーダイル,ヨルノズク,レディアン,アリアドス,クロバット,チョンチー,ランターン,トゲチック,ネイティオ,デンリュウ,キレイハナ,ウソッキー,ニョロトノ,ヒマナッツ,ヤンヤンマ,ブラッキー,ヤミカラス,ヤドキング,アンノーン,ソーナンス,キリンリキ,クヌギダマ,フォレトス,グライガー,ハガネール,グランブル,ハリーセン,ヘラクロス,マグマッグ,マグカルゴ,テッポウオ,デリバード,マンタイン,エアームド,キングドラ,ドンファン,ポリゴン2,カポエラー,ムチュール,エレキッド,ミルタンク,ヨーギラス,サナギラス,バンギラス,ジュプトル,ジュカイン,ワカシャモ,バシャーモ,ミズゴロウ,ヌマクロー,ラグラージ,ジグザグマ,マッスグマ,カラサリス,アゲハント,ドクケイル,ハスブレロ,ルンパッパ,ダーテング,オオスバメ,ペリッパー,サーナイト,アメモース,キノガッサ,ヤルキモノ,ケッキング,テッカニン,ゴニョニョ,バクオング,マクノシタ,ハリテヤマ,エネコロロ,ボスゴドラ,チャーレム,ライボルト,バルビート,イルミーゼ,マルノーム,サメハダー,ホエルオー,ブーピッグ,パッチール,ナックラー,ビブラーバ,フライゴン,チルタリス,ザングース,ハブネーク,ルナトーン,ソルロック,ドジョッチ,シザリガー,ネンドール,ユレイドル,アーマルド,ミロカロス,カクレオン,カゲボウズ,ジュペッタ,サマヨール,トロピウス,ユキワラシ,オニゴーリ,タマザラシ,トドグラー,トドゼルガ,ハンテール,サクラビス,ジーランス,ボーマンダ,メタグロス,レジロック,レジアイス,レジスチル,ラティアス,ラティオス,カイオーガ,グラードン,レックウザ,デオキシス,ハヤシガメ,ドダイトス,モウカザル,ゴウカザル,ポッチャマ,ポッタイシ,エンペルト,ムクバード,ムクホーク,コロボーシ,コロトック,レントラー,ロズレイド,ズガイドス,ラムパルド,タテトプス,トリデプス,ミノムッチ,ミノマダム,ガーメイル,ミツハニー,ビークイン,フローゼル,チェリンボ,カラナクシ,トリトドン,エテボース,フワライド,ミミロップ,ムウマージ,ドンカラス,ニャルマー,ブニャット,リーシャン,スカンプー,スカタンク,ドーミラー,ドータクン,ガブリアス,ヒポポタス,カバルドン,ドラピオン,グレッグル,ドクロッグ,マスキッパ,ケイコウオ,ネオラント,ユキカブリ,ユキノオー,マニューラ,ジバコイル,ベロベルト,ドサイドン,モジャンボ,エレキブル,ブーバーン,トゲキッス,メガヤンマ,リーフィア,グレイシア,グライオン,ポリゴンZ,エルレイド,ダイノーズ,ヨノワール,ユキメノコ,エムリット,ディアルガ,ヒードラン,レジギガス,ギラティナ,クレセリア,ダークライ,アルセウス,ビクティニ,ツタージャ,ジャノビー,ジャローダ,チャオブー,エンブオー,ミジュマル,フタチマル,ダイケンキ,ミルホッグ,ヨーテリー,ハーデリア,ムーランド,チョロネコ,レパルダス,ヤナッキー,バオッキー,ヒヤッキー,ムシャーナ,ハトーボー,ケンホロウ,ゼブライカ,ギガイアス,ココロモリ,モグリュー,ドリュウズ,ドッコラー,ドテッコツ,ローブシン,ガマゲロゲ,ハハコモリ,ペンドラー,エルフーン,ドレディア,ワルビアル,ダルマッカ,ヒヒダルマ,マラカッチ,イシズマイ,イワパレス,ズルズキン,シンボラー,デスカーン,プロトーガ,アバゴーラ,アーケオス,ヤブクロン,ダストダス,ゾロアーク,チラーミィ,チラチーノ,ゴチルゼル,ランクルス,コアルヒー,バニプッチ,バニリッチ,バイバニラ,メブキジカ,シュバルゴ,タマゲタケ,モロバレル,ブルンゲル,ママンボウ,デンチュラ,テッシード,ナットレイ,ギギギアル,シビシラス,シビビール,シビルドン,ランプラー,シャンデラ,オノノクス,クマシュン,ツンベアー,フリージオ,チョボマキ,アギルダー,コジョフー,コジョンド,クリムガン,キリキザン,バッフロン,ウォーグル,バルチャイ,バルジーナ,クイタラン,アイアント,サザンドラ,ウルガモス,コバルオン,テラキオン,ビリジオン,トルネロス,ボルトロス,ランドロス,ケルディオ,メロエッタ,ゲノセクト,ハリマロン,ハリボーグ,ブリガロン,テールナー,ゲコガシラ,ゲッコウガ,ヒノヤコマ,コフキムシ,コフーライ,カエンジシ,フラエッテ,メェークル,ゴーゴート,ヤンチャム,トリミアン,ニャスパー,ニダンギル,ギルガルド,シュシュプ,フレフワン,ペロッパフ,ペロリーム,マーイーカ,カラマネロ,ガメノデス,ドラミドロ,ウデッポウ,ブロスター,エリキテル,エレザード,ガチゴラス,アマルルガ,ニンフィア,ルチャブル,ヌメルゴン,クレッフィ,オーロット,バケッチャ,パンプジン,カチコール,クレベース,オンバット,オンバーン,ゼルネアス,イベルタル,フクスロー,ニャヒート,ガオガエン,オシャマリ,アシレーヌ,ケララッパ,ドデカバシ,ヤングース,デカグース,アゴジムシ,デンヂムシ,クワガノン,マケンカニ,ケケンカニ,オドリドリ,アブリボン,ルガルガン,ドヒドイデ,ドロバンコ,バンバドロ,ラランテス,マシェード,ヤトウモリ,ヌイコグマ,キテルグマ,アママイコ,アマージョ,キュワワー,コソクムシ,シロデスナ,ナマコブシ,ネッコアラ,バクガメス,トゲデマル,ミミッキュ,ハギギシリ,ジジーロン,ジャランゴ,コスモッグ,コスモウム,ソルガレオ,ルナアーラ,ウツロイド,テッカグヤ,カミツルギ,ネクロズマ,アーゴヨン,ズガドーン,メルメタル,バチンキー,ラビフット,ジメレオン,ホシガリス,ヨクバリス,アオガラス,サッチムシ,レドームシ,ワタシラガ,カジリガメ,パルスワン,トロッゴン,カジッチュ,タルップル,サダイジャ,サシカマス,マルヤクデ,オトスパス,ポットデス,ブリムオン,オーロンゲ,サニゴーン,バリコオル,デスバーン,マホイップ,タイレーツ,バチンウニ,コオリッポ,イエッサン,ドラメシヤ,ドラパルト,ザマゼンタ,ウーラオス,レジエレキ,レジドラゴ,ブリザポス,レイスポス,イダイトウ,ハリーマン,ラブトロス,ニャローテ,アチゲータ,ウェルカモ,ワナイダー,マメバッタ,パーモット,パピモッチ,オリーニョ,オリーヴァ,イキリンコ,ハラバリー,タギングル,ノノクラゲ,リククラゲ,カプサイジ,カヌチャン,ウミトリオ,オトシドリ,ナミイルカ,イルカマン,モトトカゲ,キラフロル,ハカドッグ,カラミンゴ,アルクジラ,ハルクジラ,ミガルーサ,シャリタツ,コノヨザル,リキキリン,ノココッチ,ドドゲザン,セグレイブ,コレクレー,サーフゴー,パオジアン,ディンルー,コライドン,ミライドン,カミッチュ,ヤバソチャ,イイネイヌ,マシマシラ,キチキギス,オーガポン,テラパゴス,モモワロウ`;
let WORDS=[...new Set(fallback.split(','))].filter(w=>[...w].length===5);
const keyRows=[
'アイウエオ',
'カキクケコ',
'サシスセソ',
'タチツテト',
'ナニヌネノ',
'ハヒフヘホ',
'マミムメモ',
'ヤユヨ',
'ラリルレロ',
'ワヲン',
'ガギグゲゴ',
'ザジズゼゾ',
'ダヂヅデド',
'バビブベボ',
'パピプペポ',
'ァィェォヴ',
'2Z♀♂'
]; const keySmall=['゛゜ー','ャュョッ'];
let seed='', gameNo=0, answer='', row=0, col=0, current='', finished=false, keyboardState={};
const $=id=>document.getElementById(id); const board=$('board');
function hash(s){let h=2166136261;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(s){let x=hash(s)||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function choose(){const r=rng(seed+'|'+gameNo); return WORDS[Math.floor(r()*WORDS.length)]}
function renderBoard(){board.innerHTML='';for(let r=0;r<10;r++){let rowEl=document.createElement('div');rowEl.className='row';for(let c=0;c<5;c++){let t=document.createElement('div');t.className='tile';if(r<row){t.textContent=history[r]?.word[c]||'';t.classList.add(history[r]?.state[c]||'')}else if(r===row&&c<col){t.textContent=[...current][c]||'';t.classList.add('filled')}rowEl.appendChild(t)}board.appendChild(rowEl)}}
let history=[];
function setStatus(){ $('status').textContent=seed?`合い言葉「${seed}」｜第${gameNo+1}問｜${row}/10回`:'合い言葉を入れて開始';}
function buildKeyboard(){const k=$('keyboard');k.innerHTML='';
keyRows.forEach(s=>{let kr=document.createElement('div');kr.className='keyrow';for(const ch of [...s]){let b=document.createElement('button');b.className='key';b.textContent=ch;b.dataset.ch=ch;b.onclick=()=>input(ch);kr.appendChild(b)}k.appendChild(kr)});
keySmall.forEach(s=>{let kr=document.createElement('div');kr.className='keyrow keyrow-small';for(const ch of [...s]){let b=document.createElement('button');b.className='key key-small';b.textContent=ch;b.dataset.ch=ch;b.onclick=()=>input(ch);kr.appendChild(b)}k.appendChild(kr)});
let actions=document.createElement('div');actions.className='keyrow actions';let del=document.createElement('button');del.className='key wide';del.textContent='削除';del.onclick=backspace;actions.appendChild(del);let enter=document.createElement('button');enter.className='key wide enter';enter.textContent='ENTER';enter.onclick=submit;actions.appendChild(enter);k.appendChild(actions)}
function input(ch){if(finished||row>=10)return;if(col<5){current+=ch;col++;renderBoard()}}
function backspace(){if(col){current=[...current].slice(0,-1).join('');col--;renderBoard()}}
function normalize(s){return s.replace(/ﾞ/g,'゛').replace(/ﾟ/g,'゜')}
function judge(guess,ans){let g=[...guess],a=[...ans],st=Array(5).fill('absent'),counts={};for(const ch of a)counts[ch]=(counts[ch]||0)+1;for(let i=0;i<5;i++)if(g[i]===a[i]){st[i]='correct';counts[g[i]]--}for(let i=0;i<5;i++)if(st[i]!=='correct'&&counts[g[i]]>0){st[i]='present';counts[g[i]]--}return st}
function isValid(w){return WORDS.includes(w)}
function submit(){if(finished)return;if(col!==5){$('msg').textContent='5文字入力してくれ。';return}if(!isValid(current)){$('msg').textContent='候補にないポケモンだ。';return}const states=judge(current,answer);history.push({word:current,state:states});for(let i=0;i<5;i++){const ch=[...current][i];const rank=states[i];const old=keyboardState[ch];if(rank==='correct'||(rank==='present'&&old==='absent')||(!old&&rank==='absent'))keyboardState[ch]=rank}row++;renderBoard();updateKeys();setStatus();const won=current===answer;if(won||row>=10){finished=true;setTimeout(()=>endGame(won),650)}current='';col=0}
function updateKeys(){document.querySelectorAll('.key').forEach(b=>{let s=keyboardState[b.dataset.ch];if(s)b.classList.add(s)})}
function endGame(won){$('modalTitle').textContent=won?'正解！':'10回終了';$('answer').textContent=answer;$('modal').classList.add('on');setTimeout(()=>{ $('modal').classList.remove('on'); gameNo++; start(seed,false); },1100)}
function start(seedValue, resetNo=true){seed=seedValue.trim();if(!seed)return;if(resetNo)gameNo=0;answer=choose();row=0;col=0;current='';history=[];keyboardState={};finished=false;$('msg').textContent='';$('modal').classList.remove('on');setStatus();renderBoard();buildKeyboard()}
$('startBtn').onclick=()=>start($('seed').value,true);
$('randomBtn').onclick=()=>{const s='ランダム-'+Math.random().toString(36).slice(2,10);$('seed').value=s;start(s,true)};
$('newBtn').onclick=()=>{if(!seed){$('msg').textContent='先に合い言葉を入れてくれ。';return}gameNo++;start(seed,false)};
$('nextBtn').onclick=()=>{$('modal').classList.remove('on');gameNo++;start(seed,false)};
document.addEventListener('keydown',e=>{if(e.key==='Enter')submit();else if(e.key==='Backspace')backspace();else if(/^[ァ-ヶー]$/.test(e.key))input(e.key)});
buildKeyboard();renderBoard();
</script></body></html>
